# Spring Boot 后端运行配置。
spring.config.import=optional:file:depoy/.env[.properties],optional:file:../depoy/.env[.properties],optional:file:../../depoy/.env[.properties]
server.address=${BACKEND_HOST:0.0.0.0}
server.port=${BACKEND_PORT:8001}
tradeagent.market.refresh-seconds=${STOCK_REFRESH_SECONDS:60}
tradeagent.market.akshare-base-url=${AKSHARE_ADAPTER_BASE_URL:http://localhost:8002}
tradeagent.watchlist.default-symbol=${DEFAULT_STOCK_SYMBOL:000001}
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/tradeagent}
spring.datasource.username=${POSTGRES_USER:tradeagent}
spring.datasource.password=${POSTGRES_PASSWORD:tradeagent}
spring.datasource.driver-class-name=org.postgresql.Driver
mybatis-plus.mapper-locations=classpath*:mybatis/*.xml
mybatis-plus.type-handlers-package=com.tradeagent.scanner.repository.typehandler
tradeagent.research.akshare-base-url=${AKSHARE_ADAPTER_BASE_URL:http://localhost:8002}
tradeagent.research.deepseek-api-key=${DeepSeek_API_KEY:${DEEPSEEK_API_KEY:}}
tradeagent.research.deepseek-base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
tradeagent.research.deepseek-model=${DEEPSEEK_MODEL:deepseek-v4-flash}
tradeagent.research.deepseek-enabled=${DEEPSEEK_ENABLED:true}
tradeagent.research.ai-batch-size=${RESEARCH_AI_BATCH_SIZE:10}
# Scanner 随后端始终启动，依赖 PostgreSQL 和 RabbitMQ。
# 官方来源 ID 必须显式配置。
tradeagent.scanner.official-sources=${SCANNER_OFFICIAL_SOURCES:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:tradeagent}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:tradeagent}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
